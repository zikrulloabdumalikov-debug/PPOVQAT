name: Edge Functions deploy
# Qo'lda ishga tushiriladi: Actions → "Edge Functions deploy" → Run workflow.
# Kerak: repo Secrets → SUPABASE_ACCESS_TOKEN (supabase.com → Account → Access Tokens).
on:
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: ewxrdloawszmxyojlzdh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Testlar (deploydan oldin)
        run: npm test
        env:
          SOGLOM_PG_URL: postgres://postgres:postgres@localhost:5432/
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy
        run: supabase functions deploy api telegram-webhook cron --project-ref "$PROJECT_REF" --no-verify-jwt
