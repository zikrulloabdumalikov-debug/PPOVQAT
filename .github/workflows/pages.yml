name: Mini App (GitHub Pages)
on:
  push:
    branches: [claude/wonderful-meitner-cxc9ps]
    paths: ['frontend/**', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: API manzilini yozish
        env:
          API_URL: ${{ vars.API_URL }}
        run: |
          if [ -z "$API_URL" ]; then echo "Repo Variables da API_URL yo'q"; exit 1; fi
          printf "window.APP_CONFIG = { API_URL: '%s', DEV: false };\n" "$API_URL" > frontend/config.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend
      - id: deployment
        uses: actions/deploy-pages@v4
